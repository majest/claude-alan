function useImage(src) {
  picked = src;
  dropBox.innerHTML = "";
  const img = document.createElement("img");
  img.src = src;
  dropBox.appendChild(img);
  goBtn.disabled = false;
  idResult.innerHTML = "";
  document.getElementById("idRow").classList.remove("done");
  document.getElementById("dropCol").classList.remove("asShot");
}

dropBox.addEventListener("click", () => filePick.click());
filePick.addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => useImage(ev.target.result);
  r.readAsDataURL(f);
});

window.addEventListener("paste", e => {
  for (const item of e.clipboardData.files) {
    if (item.type.startsWith("image/")) {
      const r = new FileReader();
      r.onload = ev => useImage(ev.target.result);
      r.readAsDataURL(item);
      return;
    }
  }
});

["dragenter", "dragover"].forEach(ev =>
  dropBox.addEventListener(ev, e => { e.preventDefault(); dropBox.classList.add("over"); }));
["dragleave", "drop"].forEach(ev =>
  dropBox.addEventListener(ev, e => { e.preventDefault(); dropBox.classList.remove("over"); }));
dropBox.addEventListener("drop", e => {
  const f = e.dataTransfer.files[0];
  if (!f || !f.type.startsWith("image/")) return;
  const r = new FileReader();
  r.onload = ev => useImage(ev.target.result);
  r.readAsDataURL(f);
});

// Counts up the colours in a picture. The same function is used on your photo
// and on the library's own pictures, which is the whole point: before, the
// photo was measured one way and the plants were described by hand on a
// completely different scale, so the comparison was meaningless.
function measure(data) {
  let r = 0, g = 0, b = 0, dark = 0, n = data.length / 4;
  for (let i = 0; i < data.length; i += 4) {
    r += data[i]; g += data[i + 1]; b += data[i + 2];
    if ((data[i] + data[i + 1] + data[i + 2]) / 3 < 110) dark++;
  }
  const total = r + g + b || 1;
  return { red: r / total, green: g / total, blue: b / total, dark: dark / n };
}

function readShot(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const n = 64;
      const c = document.createElement("canvas");
      c.width = n; c.height = n;
      const g = c.getContext("2d");
      g.drawImage(img, 0, 0, n, n);
      resolve(measure(g.getImageData(0, 0, n, n).data));
    };
    img.onerror = () => resolve({ red: 0.33, green: 0.34, blue: 0.33, dark: 0.3 });
    img.src = src;
  });
}

// Every plant measured from its own picture, once, when the page loads.
const LOOKS = {};
function measureLibrary() {
  const n = 120;
  for (const p of PLANTS) {
    const c = document.createElement("canvas");
    c.width = n; c.height = n;
    const g = c.getContext("2d");
    g.fillStyle = "#e8ece4";                 // a plain background, like a photo has
    g.fillRect(0, 0, n, n);
    g.save();
    g.translate(n / 2, n * 0.62);
    g.scale(n / 260, n / 260);
    ART[p.draw](g);
    g.restore();
    LOOKS[p.id] = measure(g.getImageData(0, 0, n, n).data);
  }
}

function howClose(p, shot) {
  const L = LOOKS[p.id];
  return Math.abs(L.green - shot.green) * 3 +
         Math.abs(L.red - shot.red) * 2 +
         Math.abs(L.blue - shot.blue) * 2 +
         Math.abs(L.dark - shot.dark) * 0.8;
}

goBtn.addEventListener("click", async () => {
  if (!picked) return;
  const row = document.getElementById("idRow");
  row.classList.add("done");
  document.getElementById("dropCol").classList.add("asShot");

  // the picture moves over to the right, still big
  idResult.innerHTML = '<div class="thinking"><div class="spinner"></div>' +
    '<p style="margin:0;color:#5c6f5c">Looking at your picture…</p></div>';

  const shot = await readShot(picked);
  await new Promise(r => setTimeout(r, 1100));   // let the circle actually show

  const scored = PLANTS.map(p => ({ p: p, score: howClose(p, shot) }))
                       .sort((a, b) => a.score - b.score);

  // The two closest from each kind, so a carnivorous plant is always offered.
  // Ranking across all thirty-six buried them every time, because a lot of
  // plants are green and the greenest-looking ones won on colour alone.
  const best = [];
  for (const key of ["carnivorous", "house", "outside"]) {
    best.push(...scored.filter(s => s.p.group === key).slice(0, 2));
  }
  best.sort((a, b) => a.score - b.score);

  idResult.innerHTML =
    '<h2 class="section">Closest matches</h2>' +
    '<p style="margin:0 0 14px;color:#5c6f5c;font-size:15px">' +
    'The nearest two of each kind. Pick whichever looks like your plant and ' +
    'I will tell you how to look after it.</p>' +
    '<div class="guesses" id="guesses"></div>' +
    '<p style="margin:14px 0 0;color:#5c6f5c;font-size:14px">' +
    'None of them right? <button class="backBtn" style="margin:0" id="seeAll">' +
    'Look through all thirty-six</button></p>';

  const wrap = document.getElementById("guesses");
  best.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "guess";
    b.innerHTML = '<canvas width="76" height="76"></canvas>' +
      '<span><span class="gName">' + s.p.name +
      (i === 0 ? ' <span style="font-size:13px;color:#3f8f4a">closest</span>' : '') +
      '</span><br><span class="gSub">' + s.p.latin + " · " +
      GROUPS[s.p.group].name + '</span></span>';
    b.addEventListener("click", () => openPlant(s.p.id, picked));
    wrap.appendChild(b);
    paintPlant(b.querySelector("canvas"), s.p.id);
  });

  document.getElementById("seeAll").addEventListener("click", () => {
    tabMode = "browse";
    openGroup = null;
    drawTabs("browse");
    showAllPlants();
  });
});

// ---------------------------------------------------------------------------
// The walls of pictures
// ---------------------------------------------------------------------------
function cardsFor(list, title, blurb) {
  viewGrid.innerHTML =
    '<h2 class="section">' + title + '</h2>' +
    (blurb ? '<p class="note">' + blurb + '</p>' : '') +
    '<div class="grid" id="grid"></div>';
  const grid = document.getElementById("grid");
  for (const p of list) {
    const b = document.createElement("button");
    b.className = "card";
    b.innerHTML = '<canvas></canvas><div class="cName">' + p.name +
      '</div><div class="cLatin">' + p.latin + '</div>';
    b.addEventListener("click", () => openPlant(p.id, null));
    grid.appendChild(b);
    paintPlant(b.querySelector("canvas"), p.id);
  }
  show("grid");
}

function showAllPlants() {
  cardsFor(PLANTS, "All the plants",
    "Click any plant to read how to look after it, or pick one of the three kinds above.");
}

function showGroup(key) {
  cardsFor(PLANTS.filter(p => p.group === key), GROUPS[key].name, GROUPS[key].blurb);
}

// ---------------------------------------------------------------------------
// One plant's write-up
// ---------------------------------------------------------------------------
function openPlant(id, photo) {
  const p = PLANTS.find(x => x.id === id);
  viewPage.innerHTML =
    '<button class="backBtn" id="pageBack">← Back</button>' +
    '<div class="identify done">' +
      '<div class="page">' +
        '<h2>' + p.name + '</h2>' +
        '<p class="latin">' + p.latin + '</p>' +
        '<h3>Watering</h3><p>' + p.water + '</p>' +
        '<h3>Light and winter</h3><p>' + p.light + '</p>' +
        '<h3>Making more of it</h3><p>' + p.grow + '</p>' +
        '<h3>Dusting and cutting</h3><p>' + p.clean + '</p>' +
        '<div class="pests"><b>Pests.</b> ' + p.pests + '</div>' +
      '</div>' +
      '<div class="shot">' +
        (photo
          ? '<img src="' + photo + '" alt=""><div class="cap">Your picture</div>'
          : '<canvas id="pageArt" width="340" height="340"></canvas>' +
            '<div class="cap">' + p.name + '</div>') +
      '</div>' +
    '</div>';

  document.getElementById("pageBack").addEventListener("click", () => {
    if (tabMode === "browse") {
      openGroup ? showGroup(openGroup) : showAllPlants();
    } else {
      show("home");
    }
  });

  const art = document.getElementById("pageArt");
  if (art) paintPlant(art, p.id);
  show("page");
}

// ---------------------------------------------------------------------------
measureLibrary();
drawTabs("home");
show("home");
