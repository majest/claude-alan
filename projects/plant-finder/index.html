<!doctype html>

<title>Plant Finder</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #f2f6ef; }
  body {
    font-family: ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: #1d2a1f;
    -webkit-text-size-adjust: 100%;
  }

  header {
    background: #1f4d2c;
    color: #eefbef;
    padding: 18px 20px 0;
  }
  header h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: .3px; }
  header p { margin: 0 0 14px; font-size: 15px; color: rgba(238,251,239,.75); }

  /* ---- the tabs ---- */
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab {
    appearance: none; border: 0; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 700;
    padding: 11px 20px; border-radius: 12px 12px 0 0;
    background: rgba(255,255,255,.14); color: #eefbef;
  }
  .tab:hover { background: rgba(255,255,255,.24); }
  .tab.on { background: #f2f6ef; color: #1f4d2c; }
  .tab.back { background: rgba(255,255,255,.08); }

  main { padding: 22px 20px 60px; max-width: 1120px; margin: 0 auto; }
  .view[hidden] { display: none; }

  /* ---- the identify page ---- */
  .identify {
    display: flex; gap: 28px; align-items: flex-start;
    justify-content: center; flex-wrap: wrap;
  }
  .identify.done { justify-content: space-between; }
  /* before you press Identify there is only the box, so it sits in the middle */
  #idResult:empty { display: none; }

  .dropCol { display: flex; flex-direction: column; align-items: center; gap: 14px; }

  /* the white box you put a picture in: taller than it is wide */
  .dropBox {
    width: 300px; height: 400px;
    background: #ffffff;
    border: 3px dashed #b9ccb6;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 18px; cursor: pointer;
    overflow: hidden; position: relative;
  }
  .dropBox:hover, .dropBox.over { border-color: #4caf50; background: #fbfffb; }
  .dropBox p { margin: 0; color: #6d7d6c; font-size: 15px; line-height: 1.5; }
  .dropBox img { width: 100%; height: 100%; object-fit: contain; }

  .goBtn {
    width: 300px; padding: 15px; border: 0; cursor: pointer;
    font-family: inherit; font-size: 19px; font-weight: 800;
    background: #7ed957; color: #10300f;
    border-radius: 12px;
  }
  .goBtn:hover { background: #6ecb46; }
  .goBtn:disabled { background: #cfe3c7; color: #7d8f7c; cursor: default; }

  /* while it is thinking */
  .thinking { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 40px 0; }
  .spinner {
    width: 56px; height: 56px; border-radius: 50%;
    border: 6px solid #d8e6d4; border-top-color: #3f8f4a;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .guesses { display: flex; flex-direction: column; gap: 12px; max-width: 520px; }
  .guess {
    display: flex; align-items: center; gap: 14px; width: 100%;
    padding: 12px; border-radius: 14px; cursor: pointer; text-align: left;
    background: #fff; border: 2px solid #dce8d8; font-family: inherit;
  }
  .guess:hover { border-color: #4caf50; }
  .guess canvas { width: 76px; height: 76px; flex: none; border-radius: 10px; background: #eef5ec; }
  .guess .gName { font-size: 18px; font-weight: 800; }
  .guess .gSub { font-size: 14px; color: #6d7d6c; }

  /* ---- the write-up ---- */
  .page { flex: 1 1 460px; min-width: 300px; max-width: 620px; }
  .page h2 {
    font-size: 32px; margin: 0 0 4px;
    font-weight: 800; text-decoration: underline; text-underline-offset: 5px;
  }
  .page .latin { margin: 0 0 18px; font-style: italic; color: #6d7d6c; font-size: 16px; }
  .page h3 { margin: 22px 0 6px; font-size: 18px; color: #1f4d2c; }
  .page p { margin: 0; font-size: 16px; line-height: 1.62; }
  .pests {
    margin-top: 22px; padding: 14px 16px; border-radius: 12px;
    background: #fff6e5; border-left: 5px solid #e5a600; font-size: 16px; line-height: 1.6;
  }

  .shot { flex: 0 0 340px; }
  /* once you have pressed Identify the box stops being a drop target and just
     shows your picture, over on the right, still big */
  .dropCol.asShot .dropBox {
    width: 340px; height: 440px; border-style: solid; border-color: #dce8d8; cursor: default;
  }
  .dropCol.asShot .goBtn { display: none; }
  .dropCol.asShot .shotCap { display: block; }
  .shotCap { display: none; font-size: 14px; color: #6d7d6c; }
  .shot img, .shot canvas {
    width: 100%; border-radius: 16px; background: #fff;
    border: 2px solid #dce8d8;
  }
  .shot .cap { margin-top: 8px; font-size: 14px; color: #6d7d6c; text-align: center; }

  /* ---- the picture walls ---- */
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .card {
    background: #fff; border: 2px solid #dce8d8; border-radius: 16px;
    padding: 12px; cursor: pointer; font-family: inherit; text-align: center;
  }
  .card:hover { border-color: #4caf50; transform: translateY(-2px); }
  .card canvas { width: 100%; aspect-ratio: 1 / 1; }
  .card .cName { font-size: 16px; font-weight: 800; margin-top: 6px; }
  .card .cLatin { font-size: 13px; color: #6d7d6c; font-style: italic; }

  h2.section { font-size: 22px; margin: 0 0 14px; }
  .note {
    background: #eaf3e7; border-left: 5px solid #4caf50;
    padding: 12px 15px; border-radius: 10px;
    font-size: 15px; line-height: 1.6; margin: 0 0 20px; color: #33513a;
  }
  .backBtn {
    appearance: none; border: 2px solid #cfe0ca; background: #fff; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 700; color: #1f4d2c;
    padding: 9px 16px; border-radius: 10px; margin-bottom: 16px;
  }
  .backBtn:hover { border-color: #4caf50; }
</style>

<header>
  <h1>Plant Finder</h1>
  <p>Find out what a plant is, and how to keep it alive.</p>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div class="view" id="viewHome"></div>
  <div class="view" id="viewGrid" hidden></div>
  <div class="view" id="viewPage" hidden></div>
</main>

<script>
// ---------------------------------------------------------------------------
// The plants. Everything written here is real care advice — a page that makes
// things up would get someone's plant killed.
//
//   look   roughly what colour the plant is, used for the rough guess
//   care   the four things you need to know, in the order Alan asked for
// ---------------------------------------------------------------------------
const PLANTS = [
  // ======================================================= OUTSIDE PLANTS
  {
    id: "sunflower", group: "outside", name: "Sunflower",
    latin: "Helianthus annuus", draw: "sunflower",
    water: "Push a finger a couple of centimetres into the soil at the base. Dry means water, and water deeply rather than often, so the roots follow the moisture down and the plant can hold itself up. Moist means leave it. A big sunflower in a pot in July can drink a whole watering can in a day, so check it every morning in hot weather.",
    light: "Full sun, the more the better — the clue is in the name, and a shaded sunflower grows thin, leans badly and produces a small head. There is no winter dormancy to think about, because a sunflower is an annual: it grows, flowers, sets seed and dies, all in one year.",
    grow: "You grow more from seed, which is the whole point of them. Leave a head on the plant until the back turns brown and the seeds loosen, then rub them out and keep them somewhere dry and cool. Sow in spring after the last frost. A seedling is flowering and as tall as the parent in about three months, which is faster than almost anything else you can grow.",
    clean: "Outdoor plants are dusted by the rain, so there is nothing to wipe. Cut the main stem above a node if you want side branches rather than one giant head. Deadhead spent flowers through summer to keep more coming, and stop once autumn arrives if you want to keep the seed — and leave a head or two standing, because birds strip them through winter.",
    pests: "Slugs and snails will eat a young seedling down to nothing overnight, so protect them early with a barrier or by picking them off after dark. Blackfly cluster on the stems and can be blasted off with a hose. Check seedlings daily in their first fortnight — that is when a whole row gets lost."
  },
  {
    id: "birch", group: "outside", name: "Silver Birch",
    latin: "Betula pendula", draw: "birch",
    water: "A newly planted birch needs a good soaking once a week through its first two summers, poured slowly at the base so it sinks in instead of running off. Check with a finger a few centimetres down first — if it is damp there, leave it. After two or three years it finds its own water and you can stop entirely. Birches are shallow-rooted, so they suffer in a long drought before most other trees do.",
    light: "Full sun. Birch is a pioneer tree, the first to colonise open ground, and it will not thrive shaded by anything bigger. It has a full winter dormancy: the leaves turn butter yellow and drop in autumn, and it stands bare until April. The white bark is at its best in winter, which is rather the point of planting one.",
    grow: "Collect the little cone-like catkins in autumn as they start to break apart, and rub out the tiny winged seeds. Scatter them on the surface of damp compost and leave the pot outside over winter — the cold is what makes them germinate. Seedlings appear in spring. A birch is two or three metres tall in five years, but the bark does not turn properly white until it is about eight, so the tree takes a while to look like its parent.",
    clean: "Rain does the cleaning. Prune a birch only in late summer or early autumn. This matters more than for most trees: cut it in late winter or spring and it bleeds sap heavily from the wound and cannot stop, which weakens it badly. Cut back to just above a bud or a side branch, never leaving a stub.",
    pests: "Birch is troubled by aphids, which drip sticky honeydew onto anything parked underneath, and by bracket fungi on older trees. A healthy tree shrugs off the aphids. The one to take seriously is bronze birch borer damage on a stressed tree — the best defence is simply keeping a young birch watered so it never gets stressed in the first place."
  },
  {
    id: "lavender", group: "outside", name: "Lavender",
    latin: "Lavandula", draw: "lavender",
    water: "Lavender comes from dry, stony hillsides and hates wet feet. Put your finger two centimetres in: only water if it is dry right down, and then water well and leave it. An established plant in the ground needs almost no watering at all. Far more lavender is killed by soggy winter soil than by drought.",
    light: "Full sun and free-draining soil. In shade it goes leggy, flowers poorly and rots at the base. It does not need a dormancy as such but it does slow right down in winter; the main thing is to keep it dry then, because cold plus wet is what finishes it off.",
    grow: "Take cuttings in late summer: pull off a side shoot about eight centimetres long with a little heel of older wood, strip the lower leaves, and push it into gritty compost. Roots form in four to six weeks. It looks like a small version of the parent the following summer and is a proper bush in two to three years. Seed is slow and the offspring rarely match the parent.",
    clean: "Rain keeps it clean outdoors. Cutting is the important bit: trim it every year after flowering, taking off the spent flower stems and about two or three centimetres of the green growth below them. Never cut back into the bare woody stems — lavender does not regrow from old wood and that cut stays a dead stump. Prune in late summer, and stop by early autumn so soft new growth is not caught by frost.",
    pests: "Lavender is troubled by very little, which is part of its appeal, and its scent actually helps keep aphids and moths away from plants nearby. The one thing to watch for is froghopper 'cuckoo spit' on the stems in early summer, which is harmless and can be hosed off."
  },
  {
    id: "oak", group: "outside", name: "English Oak",
    latin: "Quercus robur", draw: "oak",
    water: "A young oak needs watering through its first two or three summers while its roots go down — a bucket a week in dry weather, poured slowly so it soaks in rather than running off. Test with a finger a few centimetres into the soil first; if it is moist down there, leave it. Once established, an oak finds its own water and should never need watering again.",
    light: "Full sun. An oak grown in the shade of bigger trees stretches upward thin and weak. It has a true winter dormancy: it drops its leaves in autumn, stands bare through the cold, and comes back in late spring — it is one of the last trees to come into leaf, so a bare oak in April is not a dead one.",
    grow: "Collect a fat, unblemished acorn in autumn and float the acorns in water — the ones that sink are good, the floaters are hollow. Plant it a few centimetres deep in a deep pot, because the first thing it grows is a long taproot. It sprouts the following spring. Be honest about the timescale: it is a metre tall in three or four years and takes decades to look like a full-grown parent tree, and it will not produce its own acorns for about forty years.",
    clean: "Rain does the cleaning. For shaping, cut a branch back to just above a bud or a side branch rather than leaving a stub, which dies back and lets rot in. Prune an oak only in late summer — never in spring when the sap is rising, and never in winter, because pruning wounds made then are far more likely to become infected.",
    pests: "Oaks feed hundreds of kinds of insect and a healthy tree copes with nearly all of them, so nibbled leaves are nothing to worry about. The one that matters is oak processionary moth, whose caterpillars build white silk nests on the trunk and have hairs that irritate skin badly — never touch a nest, and tell an adult so it can be reported."
  },
  {
    id: "scotspine", group: "outside", name: "Scots Pine",
    latin: "Pinus sylvestris", draw: "pine",
    water: "Water a young pine weekly through its first two summers, then leave it alone forever. Check the soil a few centimetres down with a finger before you do — pines grow naturally on thin, sandy, poor ground and rot at the roots in soil that stays wet. A pine that has been in the ground three years should never need watering again, even in a drought.",
    light: "Full sun, always. Scots pine is the tree that colonises open heath and it cannot cope with shade at all. Being an evergreen conifer it keeps its needles all winter, so there is no bare season, but it still slows almost to a stop in the cold and does all its growing in one burst in late spring.",
    grow: "Collect closed cones in autumn and keep them somewhere warm and dry indoors; over a week or two they open on their own and drop winged seeds. Sow them in gritty compost in spring. Seedlings are slow at first — a hand's height after two years — and it takes fifteen to twenty years before the tree develops the flaking orange upper bark that makes a mature Scots pine unmistakable.",
    clean: "Rain cleans it. Pines need almost no pruning and resent it: cut a branch right back to the trunk and nothing regrows from that spot, because pines do not sprout from old wood. If you must remove a branch, do it in late summer. Never cut the leading shoot at the top, or the tree grows up forked and weak.",
    pests: "Pine sawfly caterpillars strip needles in groups and can be picked off by hand. Adelgids leave white woolly patches on the bark, which look worse than they are. A healthy, unshaded pine on dry ground deals with almost everything itself."
  },
  {
    id: "rose", group: "outside", name: "Rose",
    latin: "Rosa", draw: "rose",
    water: "Feel the soil a few centimetres down at the base. Roses are thirsty and want a deep soak — a full watering can at the roots twice a week in a dry summer is better than a daily sprinkle, which only wets the surface. Water the soil, never the leaves: wet foliage is what lets blackspot take hold.",
    light: "At least six hours of direct sun. A rose in shade produces few flowers and far more disease. It has a proper winter dormancy: it drops its leaves, stands as bare thorny stems through the cold, and shoots again in spring. That bare, dead-looking period is completely normal and is exactly when you prune it.",
    grow: "Take hardwood cuttings in autumn: a pencil-thick stem about 25 cm long, cut straight across below a bud at the bottom and slanted above a bud at the top so you remember which way up it goes. Push two-thirds of it into gritty soil in a sheltered spot and forget about it until spring. Roots take a whole winter, and the new plant flowers properly in its second or third year.",
    clean: "Rain washes the leaves, but clear fallen leaves off the ground in autumn and bin them — blackspot spores overwinter in them and reinfect the plant in spring. Prune in late winter while it is still dormant: cut about half a centimetre above an outward-facing bud, on a slant away from it, so water runs off. Stop pruning by early spring once growth begins, and only deadhead after that.",
    pests: "Greenfly swarm on new shoots and flower buds; squash them or hose them off, and ladybirds will do the rest. Blackspot and rust show as marks on the leaves — pick affected leaves off and bin them rather than composting them, or the problem returns every year and spreads along a whole row of roses."
  },
  {
    id: "tulip", group: "outside", name: "Tulip",
    latin: "Tulipa", draw: "tulip",
    water: "While it is in leaf and flower, feel the soil two centimetres down: water if dry, leave it if moist. Once the flowers are over and the leaves start yellowing, stop watering completely. The bulb is going to sleep underground for the summer, and wet soil then is the usual reason tulips rot and never come back.",
    light: "Full sun while growing and flowering. Tulips have an unusual dormancy: they rest through summer, not winter. The bulb needs a proper cold spell to flower at all, which is why they are planted in November — plant them too early in warm soil and they come up blind.",
    grow: "Lift a clump after the leaves have died back and pull the small bulbs off the side of the parent. Replant them straight away, three times their own depth. A large offset flowers the next spring; a small one takes two or three years to build up enough. Tulips grown from seed take five years or more and rarely resemble the parent, so offsets are the sensible route.",
    clean: "Rain keeps them clean. The important rule is the same as for daffodils: snap off the dead flower head so the plant does not waste energy making seed, but leave every leaf alone until it yellows and pulls away easily. Cutting the leaves early starves next year's flower. Tidy them up in June and do nothing else until autumn.",
    pests: "Squirrels and mice dig newly planted bulbs up — a layer of wire mesh over the soil stops them. Tulip fire is a fungus that makes scorched-looking, twisted leaves with brown spots; dig up and bin any plant showing it immediately, bulb and all, because it spreads through a whole bed and stays in the soil for years."
  },
  {
    id: "daffodil", group: "outside", name: "Daffodil",
    latin: "Narcissus", draw: "daffodil",
    water: "In the ground, rain is usually enough. In a pot, feel the compost two centimetres down while the plant is in leaf and growing: dry means water, moist means leave it. Once the leaves have yellowed off in early summer, stop watering altogether — the bulb is resting underground and wet soil in summer rots it.",
    light: "Sun or light shade while it is growing and flowering. Under a deciduous tree works well, because daffodils do all their growing before the tree comes into leaf. It has a proper dormancy, but an unusual one: it rests in summer, not winter. The bulb sits dry underground from June, then roots in autumn and pushes up in late winter.",
    grow: "You do not grow daffodils from cuttings — a bulb makes more bulbs beside itself. Lift a clump once the leaves have died back, pull the smaller bulbs off the side of the parent, and replant them straight away, twice their own depth. A good-sized offset flowers the very next spring; a small one takes two or three years to build up enough to flower.",
    clean: "Rain keeps them clean. The one rule that matters more than any other: do not cut the leaves off after flowering, and do not tie them in knots. The plant spends those six weeks feeding next year's flower back down into the bulb, and cutting the leaves early is the usual reason daffodils come up blind the following spring. Snap off the dead flower head, then leave the leaves alone until they yellow and pull away easily in June.",
    pests: "Narcissus bulb fly lays eggs at the neck of the bulb in late spring and the grub eats it hollow; firming the soil over the dying leaves makes it much harder for the fly to get in. Slugs chew the flowers. A bulb that comes up blind or soft is best dug out and thrown away, not replanted, so nothing spreads to the rest."
  },
  {
    id: "bluebell", group: "outside", name: "Bluebell",
    latin: "Hyacinthoides non-scripta", draw: "bluebell",
    water: "Bluebells live in damp woodland and normally need no watering at all. If you are growing them in a pot, feel the compost: water when the top two centimetres are dry while the leaves are up, and stop entirely once the leaves yellow in June. The bulb sleeps dry through the summer and rots if kept wet.",
    light: "Light, dappled shade is what they want — under trees is ideal, because they flower in April before the canopy closes over. They will manage in sun if the soil stays damp. They rest in summer rather than winter, sitting as dormant bulbs from June until the leaves push up again in late winter.",
    grow: "Lift a clump right after flowering, while the leaves are still green — this is called moving them 'in the green' and it works far better than dry bulbs, which often fail. Pull the clump apart and replant the bulbs ten centimetres deep straight away. They flower the following spring. They also seed themselves, though a seedling takes four to five years to reach flowering size.",
    clean: "Rain does everything. Never cut or mow the leaves down after flowering — they need those weeks to feed the bulb, and cutting them is how a bluebell patch slowly disappears. Let them yellow and collapse on their own in June, then clear the dead leaves away.",
    pests: "Bluebells have very few pests. The real threat is a different plant: Spanish bluebells cross with native ones and dilute them, so plant the native kind, which has narrower leaves, deeper blue flowers all hanging down one side of a nodding stem, and a strong scent. Never dig bluebells up from the wild — it is against the law."
  },
  {
    id: "foxglove", group: "outside", name: "Foxglove",
    latin: "Digitalis purpurea", draw: "foxglove",
    water: "Feel the soil two centimetres down: water when dry, leave when moist. Foxgloves like soil that stays slightly damp and will wilt dramatically in a dry spell, though they usually recover once watered. They are woodland-edge plants, so they resent both baking dry soil and standing water.",
    light: "Light shade or sun, so long as the soil does not bake. A foxglove is a biennial: in its first year it makes only a flat rosette of leaves at ground level, and it flowers in its second year and then dies. That rosette sitting there all winter is not a failed plant — it is exactly what it should be doing.",
    grow: "Let one spike go to seed and it does the work itself. Each plant makes enormous numbers of tiny seeds; shake a ripe spike where you want more, or collect the seed and scatter it on the surface in autumn without covering it, because it needs light to germinate. A seedling makes its rosette in year one and flowers in year two.",
    clean: "Rain keeps them clean. Cut the main spike off once most of the flowers have gone over and side spikes often follow, extending the display. If you want it to seed itself, leave one spike standing until the pods turn brown and split. Cut the dead plant down in autumn once the seed has dropped.",
    pests: "Slugs eat the young rosettes in winter and early spring, which is when a patch is lost, so protect them then. Otherwise foxgloves are barely troubled. Important: every part of a foxglove is poisonous — wash your hands after handling one, and never put any of it in your mouth."
  },
  {
    id: "holly", group: "outside", name: "Holly",
    latin: "Ilex aquifolium", draw: "holly",
    water: "Water a newly planted holly weekly for its first two summers, checking with a finger first. Established holly is tough and needs nothing. It dislikes soil that stays waterlogged, so if a spot puddles after rain, plant something else there.",
    light: "Sun or shade — holly is one of the few plants genuinely happy in deep shade, though it fruits far better with some sun. It is evergreen, so it never goes bare, but it stops growing entirely through the cold months. Only female hollies carry berries, and only if a male plant is growing somewhere nearby.",
    grow: "Take semi-ripe cuttings in late summer: a shoot about ten centimetres long with the soft tip removed and the lower leaves stripped. Push it into gritty compost and be patient, because holly is slow — roots can take three to four months. The young plant looks like a miniature parent quickly but takes many years to make a proper bush, and berries only come once it is mature.",
    clean: "Rain cleans it. Holly takes cutting very well, which is why it makes good hedges. Cut just above a leaf or a side shoot. Prune in late summer, never in autumn or winter if you want berries, because you will simply cut them all off. Wear thick gloves — the leaf spines are genuinely sharp.",
    pests: "Holly leaf miner makes pale winding tunnels inside the leaves; it looks bad but rarely harms the plant, and picking off the worst leaves is enough. Holly leaf blight causes black blotches and leaf fall in wet years — clear fallen leaves and bin them so it does not carry over."
  },
  {
    id: "apple", group: "outside", name: "Apple Tree",
    latin: "Malus domestica", draw: "apple",
    water: "Water a young apple tree deeply once a week through its first three summers. Check the soil a few centimetres down first. Once established it manages alone, though watering during a dry spell while the fruit is swelling makes a real difference to the size of the crop.",
    light: "Full sun for good fruit — six hours or more. In shade it grows perfectly well but produces little and the apples stay sour. It has a full winter dormancy and genuinely needs it: apples require a set number of cold hours each winter before they will flower properly in spring.",
    grow: "This is the one plant here where seed does not work: an apple pip grows into a tree, but not the same kind of apple as the parent, because apples do not come true from seed. Every named apple variety is grafted — a shoot from the parent joined onto a rootstock. Grafting is done in late winter and the new tree fruits in three to four years.",
    clean: "Rain does the washing. Prune in winter while it is dormant and leafless, cutting back to just above an outward-facing bud so the centre stays open to light and air. Take out anything dead, crossing or growing inward. Stop by late winter before the buds swell, and never prune an apple in autumn, when wounds heal slowly and let disease in.",
    pests: "Codling moth grubs tunnel into the fruit and leave a hole with brown crumbs; pheromone traps hung in late spring cut the numbers a lot. Aphids curl the new leaves. Clear up fallen apples rather than leaving them to rot underneath, because that is where next year's problems overwinter, and one neglected tree will reinfect every other apple nearby."
  },
  // ======================================================= HOUSE PLANTS
  {
    id: "monstera", group: "house", name: "Swiss Cheese Plant",
    latin: "Monstera deliciosa", draw: "monstera",
    water: "Put your finger about two centimetres into the soil. If it comes out dry, give it a good soak until water runs out of the bottom, then tip away whatever collects in the saucer. If the soil is still moist, leave it alone — a Monstera hates sitting in water, and soggy roots rot far faster than dry ones.",
    light: "It wants bright light but not direct midday sun, which scorches pale patches onto the leaves. A spot a metre or two back from a window is about right. It does not need a winter dormancy, but it will grow much more slowly from November to February, so water it less often then.",
    grow: "Cut a piece of stem just below a node — the little bump where a leaf joins, often with a brown root nub beside it. A cutting without a node will never root, however long you wait. Stand it in water or damp moss somewhere warm and roots appear in three to six weeks. It takes about two years before the new plant has the big split leaves the parent has; young leaves are heart-shaped and solid, and that is normal.",
    clean: "Wipe each leaf with a damp cloth every few weeks, holding the leaf from underneath so it does not bend. Dust settles thickly on leaves this size and blocks the light the plant needs to feed itself. To keep it tidy, cut just above a node and it will branch from there. Prune in spring or summer while it is growing, and stop by early autumn so it is not pushing out soft new growth going into winter.",
    pests: "Look under the leaves for spider mites — fine webbing and tiny pale speckles — and wipe them off with soapy water as soon as you see them. Keep a new plant apart from the others for a couple of weeks, because most collections are wiped out by something that arrived on a plant nobody checked."
  },
  {
    id: "snake", group: "house", name: "Snake Plant",
    latin: "Dracaena trifasciata", draw: "snake",
    water: "This is the one plant most people kill with kindness. Push your finger two centimetres into the soil: if there is any moisture at all, walk away. Only water when the soil is dry right through, which in winter can mean once every six weeks. When you do water it, soak it properly and let every drop drain away.",
    light: "It will survive in a dim corner and grow well in bright light, so almost anywhere in a house suits it. Direct sun through glass all afternoon can bleach the leaves. It needs no winter dormancy, but it more or less stops growing when it is cold, which is exactly when overwatering kills it.",
    grow: "Cut a leaf into pieces about eight centimetres long, keeping track of which end was the bottom — a piece planted upside down will never root. Let the cut dry for a day, then stand the bottom end in barely damp compost. Roots take a month or two and a new shoot can take six months. Splitting a big plant at the roots is far quicker and gives you a full-sized plant straight away.",
    clean: "Wipe the flat leaves down with a damp cloth now and then; they collect a surprising amount of dust and it dulls the light reaching them. There are no nodes to prune to — if a leaf is damaged, cut the whole leaf off at soil level rather than trimming the tip, because a cut tip stays blunt and brown forever. Tidy it up in spring, and leave it alone over winter.",
    pests: "Mealybugs hide where the leaves meet the soil and look like tiny blobs of cotton wool; dab them with a cotton bud dipped in soapy water. Check a new plant before it joins the shelf, because mealybugs spread along a row of pots quickly."
  },
  {
    id: "spider", group: "house", name: "Spider Plant",
    latin: "Chlorophytum comosum", draw: "spider",
    water: "Water when the top two centimetres feel dry to your finger, and let the pot drain. Spider plants store water in fat white roots, so they forgive a missed week easily. If the leaf tips turn brown and crispy, that is usually the fluoride and chlorine in tap water building up — rainwater or water left standing overnight fixes it.",
    light: "Bright light without much direct sun keeps the stripes strong; deep shade makes the leaves go plain green and floppy. No winter dormancy is needed, though growth slows right down when the light gets low, so ease off the watering.",
    grow: "This is the easiest plant in the house to copy. It sends out long stems with baby plants on the ends, already growing little white roots. Sit one on top of a pot of compost, still attached to the parent, and pin it down. Once it has rooted after two or three weeks, snip the stem. It looks just like the parent within a few months.",
    clean: "Run a damp cloth along each leaf from base to tip every few weeks so dust does not build up and dim the light. There are no nodes to worry about — just cut any brown or tatty leaf right off at the base. Trim whenever it needs it in spring and summer, and leave it be in the depths of winter.",
    pests: "Aphids sometimes cluster on the flower stems; rinse them off in the shower or wipe them away with soapy water. Because spider plants throw out so many babies, an infestation on one plant can travel to every pot you have put a baby in, so treat them all at once."
  },
  {
    id: "aloe", group: "house", name: "Aloe Vera",
    latin: "Aloe vera", draw: "aloe",
    water: "Aloe is a desert plant and stores water in its thick leaves. Push your finger two centimetres in: if there is the slightest dampness, leave it. When the soil is bone dry, water it heavily and let it all run out. Water sitting in the saucer rots the base, and a rotted aloe goes soft and brown and cannot be saved.",
    light: "It wants as much sun as you can give it — a south-facing windowsill is ideal. A plant kept too dark grows pale, stretched and floppy. It does not need a true dormancy, but keep it cooler and almost completely dry from November to February and it will be much happier.",
    grow: "Grown-up aloes push out small copies of themselves around the base, called pups. Tip the plant out, separate a pup with a few roots of its own, let the cut dry for two days so it seals, then pot it in gritty compost. It will look like a small version of the parent straight away and reach full size in two or three years. A leaf cutting will not work — it just rots.",
    clean: "Wipe the leaves with a dry or barely damp cloth; dust blocks light, and aloe is one of the few houseplants that really does need all the light it can get. Never cut a leaf halfway — take it off right at the base, because a cut leaf seals badly and stays open. Remove tatty outer leaves in spring, and do not cut anything in winter while it is resting.",
    pests: "Watch for mealybugs tucked deep between the leaves where they meet; a cotton bud and soapy water deals with them. Aloes are often kept on a sunny sill next to other succulents, and mealybugs will walk from pot to pot, so check the whole row if you find one."
  },
  {
    id: "peacelily", group: "house", name: "Peace Lily",
    latin: "Spathiphyllum", draw: "peacelily",
    water: "A peace lily tells you itself: the leaves droop dramatically when it is thirsty and lift again within hours of watering. Do not wait for that every time, though — repeated wilting weakens it. Feel the compost two centimetres down and water when it is dry, letting the pot drain fully. Brown crispy leaf tips usually mean tap water, so rainwater suits it better.",
    light: "Light shade. It is a forest floor plant and one of the few that flowers in a fairly dim room, though it flowers more with brighter indirect light. Direct sun scorches it. No winter dormancy, but it rests in the dark months and needs much less water then.",
    grow: "Split it at the roots in spring. Tip it out, find where the clump naturally separates into crowns each with its own roots and leaves, and pull them apart with your hands rather than cutting if you can. Pot each piece up. It looks like the parent immediately and will flower again within a year once settled.",
    clean: "The broad leaves collect dust quickly, so wipe them with a damp cloth every couple of weeks. There are no nodes; cut any yellow leaf or spent flower stem right down at the base. Tidy it whenever it needs it in spring and summer, and leave it alone in deep winter.",
    pests: "Watch for mealybugs and scale insects on the undersides and leaf stems, and wipe them off with soapy water. Note that a peace lily is mildly poisonous if chewed, so keep it away from pets and small children, and wash your hands after cutting it."
  },
  {
    id: "pothos", group: "house", name: "Devil's Ivy",
    latin: "Epipremnum aureum", draw: "pothos",
    water: "Feel the compost two centimetres down: dry means water, moist means leave it. Devil's ivy is famously hard to kill and copes with being forgotten, but it does rot if kept constantly wet. Yellow leaves near the base almost always mean too much water rather than too little.",
    light: "Anywhere from bright indirect light to a fairly dim corner, which is why it turns up in so many houses. The golden markings fade to plain green in low light. No winter dormancy, though it slows down markedly and wants far less water from November to February.",
    grow: "The easiest cutting there is. Cut a piece of vine just below a node — the little brown bump where a leaf joins — with two or three leaves on it. Stand it in a glass of water on a windowsill and roots appear within two weeks. Pot it up once they are a few centimetres long. It looks like the parent straight away and fills a pot within a year.",
    clean: "Wipe the leaves with a damp cloth now and then, and be gentle with the trailing stems. Cut just above a node to make it bushier — it branches from exactly that point, and the piece you removed is itself a cutting. Trim through spring and summer; leave it alone in the darkest months.",
    pests: "Mealybugs and spider mites both turn up, usually where the leaf meets the stem. Wipe them off with soapy water. Devil's ivy is often hung above other plants, and pests dropping from it land on everything below, so deal with them promptly. It is poisonous if eaten, so keep it away from pets."
  },
  {
    id: "rubber", group: "house", name: "Rubber Plant",
    latin: "Ficus elastica", draw: "rubber",
    water: "Finger two centimetres in: water when dry, leave when moist. A rubber plant would far rather be slightly dry than slightly wet. Sudden leaf drop is nearly always either overwatering or a cold draught, and the two are often mistaken for each other.",
    light: "Bright indirect light. In gloom it grows leggy with widely spaced leaves; in harsh direct sun it scorches. It does not need a dormancy but hates being moved and hates cold draughts, so once you find a spot it likes, leave it there. Water much less in winter.",
    grow: "Take a cutting just below a node with two or three leaves. It will leak white sap, which is an irritant — wipe it with a damp cloth and wash your hands, keeping it off skin and out of eyes. Let the cut seal for an hour, then put it in damp compost somewhere warm. Roots take one to two months. It takes two or three years to become a proper small tree like the parent.",
    clean: "Those big glossy leaves are dust magnets and dust really does block the light, so wipe both sides with a damp cloth every few weeks. Cut just above a node to make it branch instead of growing as one bare stem. Prune in spring or early summer only, and never in winter when the wound heals slowly.",
    pests: "Scale insects look like small brown limpets stuck along the stems and leaf veins; scrape them off with a fingernail and wipe with soapy water. They are easy to miss until there are many, so check the undersides whenever you dust it, and keep a new plant separate for a fortnight."
  },
  {
    id: "zz", group: "house", name: "ZZ Plant",
    latin: "Zamioculcas zamiifolia", draw: "zz",
    water: "The ZZ stores water in fat underground tubers, so it genuinely prefers being forgotten. Push a finger in: only water when the compost is dry right through, which can be once a month or less. It is very nearly impossible to underwater and extremely easy to drown — a mushy stem at the base means it has been watered too often.",
    light: "It tolerates low light better than almost anything else, and grows faster in bright indirect light. Keep it out of direct sun. No dormancy, but growth stops in winter and watering should almost stop with it.",
    grow: "Split the clump when repotting, separating tubers with a shoot each. You can also take a single leaflet, let the cut dry for a day and lay it on damp compost — it will eventually form a tiny tuber and then a shoot, but this takes six months to a year, so it is a patience exercise rather than a quick job.",
    clean: "The waxy leaflets shine when wiped and look dull with dust, so run a damp cloth over them occasionally. Cut a whole stem off at soil level if it yellows, rather than trimming leaflets. Do any tidying in spring or summer. It is poisonous if chewed and the sap can irritate skin, so wash your hands afterwards.",
    pests: "Very few, which is another reason it is popular. Occasionally mealybugs appear where a stem leaves the soil; a cotton bud and soapy water deals with them. Because it is so often placed in dark corners and forgotten, check it over now and then rather than only when something looks wrong."
  },
  {
    id: "orchid", group: "house", name: "Moth Orchid",
    latin: "Phalaenopsis", draw: "orchid",
    water: "Do not judge by the compost, because there is not really any — an orchid grows in bark. Look at the roots through the clear pot: silvery grey means thirsty, plump green means leave it. Water by soaking the whole pot in rainwater for ten minutes, then let every drop drain out. Water left in the crown where the leaves meet will rot it, so tip it out.",
    light: "Bright indirect light, such as an east-facing sill. Direct midday sun burns the leaves. It has no dormancy, but a cool spell is the trigger for flowering: a few weeks in autumn where nights drop to around 16 degrees is what makes it produce a new flower spike.",
    grow: "Sometimes a baby orchid, called a keiki, forms on an old flower spike. Wait until it has two or three roots a few centimetres long, then cut the spike either side of it and pot it in bark. It flowers in a year or two. Growing orchids from seed needs a sterile laboratory, so keikis and dividing are the only practical routes at home.",
    clean: "Wipe the broad leaves with a damp cloth, supporting them from beneath. When the last flower drops, cut the spike just above one of the low bumps on the stem and it will often branch and flower again; if the spike has gone brown and dry, cut it right to the base. Do this after flowering and leave it alone while it is in bloom.",
    pests: "Scale and mealybugs hide underneath leaves and between roots; wipe them off with soapy water. Fungus gnats appear if the bark is kept too wet, which is itself a warning sign. Check new orchids carefully — a supermarket plant often arrives with scale already on it."
  },
  {
    id: "fern", group: "house", name: "Boston Fern",
    latin: "Nephrolepis exaltata", draw: "fern",
    water: "This is the opposite of the succulents: a Boston fern must never dry out completely. Feel the compost daily in summer and water as soon as the very top feels dry, keeping it evenly moist but not sitting in a puddle. Dry compost for even a day or two turns the fronds crisp and brown, and those fronds do not recover.",
    light: "Light shade or bright indirect light — never direct sun. It also wants humid air, which is why a bathroom suits it so well; in a dry heated room the tips brown off. No winter dormancy, but it grows slowly in the cold and the heating is the real enemy then.",
    grow: "Split the clump in spring. Tip it out and pull or cut the root ball into two or three pieces, each with a good handful of fronds and roots. Pot them separately and keep them humid while they settle. Each piece looks like a small parent immediately and fills its pot within a season. Ferns also produce spores under the fronds, but growing from spores is slow and fiddly.",
    clean: "Do not wipe the fronds — they are far too delicate and rubbing snaps them. Instead, mist it or stand it in the shower under a gentle lukewarm spray, which both cleans and humidifies. Snip any brown frond off right at the base. Tidy it any time; there is no season to avoid.",
    pests: "Scale insects sometimes stick to the frond stems and look like tiny brown lumps. Be careful with soapy sprays: ferns are more easily damaged by them than most houseplants, so wipe the insects off by hand where you can. Dry air causes more brown fronds than any pest does."
  },
  {
    id: "christmascactus", group: "house", name: "Christmas Cactus",
    latin: "Schlumbergera", draw: "christmascactus",
    water: "Despite the name it is a jungle plant, not a desert one, and it wants more water than a normal cactus. Feel the compost: water when the top two centimetres are dry and let it drain. Keep it a little drier for a month after flowering while it rests, then resume. Shrivelled, limp segments usually mean too little water, not too much.",
    light: "Bright indirect light. Direct sun turns the segments red and sickly. The flowering trigger is the interesting part: it needs long nights to set buds, so from about October give it twelve to fourteen hours of complete darkness each night for six weeks and it flowers at Christmas. A lamp left on in the room is the usual reason one never flowers.",
    grow: "One of the simplest cuttings. Twist off a piece of two or three segments at a joint rather than cutting it, let the end dry for a day or two so it seals, then push it a centimetre into damp compost. Roots form in three to four weeks. It flowers in its second year and looks like the parent within two.",
    clean: "Rinse it under a gentle lukewarm shower rather than wiping, since the segments snap off easily. Prune by twisting off segments at a joint after flowering, which makes it bushier and gives you cuttings. Never prune while it is in bud, or you will knock every flower off.",
    pests: "Mealybugs settle in the joints between segments; a cotton bud and soapy water gets them. Watch also for stem rot at soil level, which comes from overwatering — a healthy plant is firm at the base, and a soft brown base cannot be saved, so take cuttings from the good end immediately."
  },
  {
    id: "stringofhearts", group: "house", name: "String of Hearts",
    latin: "Ceropegia woodii", draw: "hearts",
    water: "It stores water in its leaves and in round tubers along the stems, so treat it like a succulent. Finger in the compost: water only when dry right through, then soak and drain. In winter it needs very little. Yellow leaves dropping off the strands almost always mean it has been watered too often.",
    light: "Bright light, including some direct sun, which is what keeps the leaves close together and strongly marbled. In poor light the strands grow long and bare with big gaps between the leaves. No dormancy, but growth stops in winter and watering should nearly stop too.",
    grow: "Two easy ways. Lay a length of strand on damp compost and pin it down — wherever a little round tuber touches the surface, it roots and sprouts. Or cut a piece with several leaf pairs and stand it in water. Either takes two to four weeks. It looks like the parent quickly but takes a year or two to grow really long strands.",
    clean: "Do not wipe the strands; they tangle and snap. Lift them gently and rinse under a light spray instead. Trim any bare or straggly strand just above a leaf pair, and the cut piece is a free cutting. Tidy in spring or summer, not in winter.",
    pests: "Mealybugs hide among the tangled strands and are very easy to miss until there are a lot, so lift the strands and look properly every few weeks. Because it usually hangs above other plants, anything falling from it lands on them, so check the pots underneath too."
  },
  // ======================================================= CARNIVOROUS PLANTS
  {
    id: "flytrap", group: "carnivorous", name: "Venus Flytrap",
    latin: "Dionaea muscipula", draw: "flytrap",
    water: "Touch the moss on top: if it is still moist, leave it alone. If it is starting to dry, top the tray up. A flytrap should stand in a saucer with a centimetre or two of water in the growing season, so the moss never dries out completely. It must be rainwater, distilled water or water from a dehumidifier — tap water carries minerals that build up in the moss and kill it within months. Never feed it meat from your dinner; an insect or nothing at all.",
    light: "It wants full, direct sun — four hours a day at the very least, and more is better. Good light is what turns the insides of the traps deep red. It absolutely needs a winter dormancy: from about November to February it should sit somewhere cold, between roughly 2 and 10 degrees, with the water tray emptied and the moss only damp. It will look half dead and lose most of its traps. That is normal, and a plant denied its winter rest usually dies in its second year.",
    grow: "The easiest way is to split the clump. Tip it out in early spring, tease apart a rosette that has its own white roots, and pot it into moss and perlite with no fertiliser at all. It looks like the parent straight away. Leaf pullings also work: pull a whole leaf downward so the white base comes away, lay it on damp moss in a sealed bag in the light, and tiny plants appear in about two months, though they take two to three years to reach full size.",
    clean: "There is not much to dust — the traps are small and rain or a light misting rinses them. Cut off any black, dead trap at the base of its stalk with scissors; dead leaves left on damp moss grow mould that spreads to healthy growth. Trim through spring and summer whenever traps blacken, and stop once dormancy starts, leaving the dead growth until you tidy it in early spring.",
    pests: "Aphids attack new growth and leave it twisted and stunted; the safest fix is to submerge the whole plant under rainwater for a day, which drowns them without chemicals. Never use ordinary bug spray on a carnivorous plant. Keep a new plant apart for a fortnight, because aphids move between pots and a shelf of carnivorous plants can be ruined by one infested arrival."
  },
  {
    id: "sundew", group: "carnivorous", name: "Cape Sundew",
    latin: "Drosera capensis", draw: "sundew",
    water: "Feel the moss: if it is moist, leave it. A Cape sundew likes to sit in a tray with a centimetre of rainwater all year round and is far less fussy than a flytrap. Rainwater or distilled water only — tap water will kill it. If the sticky dew on the tentacles disappears, the air is too dry or the water is wrong, and those are the first things to check.",
    light: "Bright light, including a few hours of direct sun, is what keeps the dew glistening and the leaves flushed red. In poor light it goes plain green and the dew dries up. It needs no winter dormancy at all, which is what makes it a much easier first carnivorous plant than a flytrap — just keep it on a windowsill all year.",
    grow: "It is one of the easiest plants there is to copy. Cut a healthy leaf into pieces, lay them on damp moss, and keep them humid and bright. Little plants appear along the cuttings in four to six weeks. They look like small versions of the parent within a few months and are fully grown inside a year. It also scatters its own seed and will pop up in every neighbouring pot given the chance.",
    clean: "Do not wipe the leaves — the dew is the whole point and rubbing it off costs the plant a meal. Snip dead black leaves off at the base so mould does not take hold on the wet moss. Tidy it any time during the year, since it never goes dormant, but cut less in the dim middle of winter when it is growing slowly.",
    pests: "Aphids go for the curled new growth in the centre; drowning the plant under rainwater for a day clears them without chemicals. Sundews catch a lot of small flying pests themselves, which quietly protects the plants standing near them."
  },
  {
    id: "forkedsundew", group: "carnivorous", name: "Forked Sundew",
    latin: "Drosera binata", draw: "forkedsundew",
    water: "Check the moss with a finger; moist means leave it. Stand it in a tray with a centimetre or two of rainwater through spring and summer. Rainwater or distilled only. It is a large, thirsty sundew and the tray should not be allowed to run dry while it is growing.",
    light: "Full sun to bright light. Good light keeps the forked leaves upright and heavily dewed; poor light makes them floppy and bare. Unlike the Cape sundew it does take a winter rest: growth slows or stops, older leaves die back, and it wants to be cooler and only damp from November to February. Reduce the tray then rather than emptying it entirely.",
    grow: "Root cuttings are the reliable method and slightly unusual. Tip the plant out, snip a piece of thick black root two or three centimetres long, lay it on damp moss and keep it humid and bright. New plants sprout along it in about six weeks. Leaf cuttings work too. Either way it reaches parent size in a year or so.",
    clean: "Never wipe the leaves; the dew is the trap. Rinse it with rainwater if it gets dusty. Cut dead brown leaves off at the base with scissors so mould does not spread across the wet moss. Tidy it in spring and summer, and leave the dying leaves alone through the winter rest.",
    pests: "Aphids attack the curled new growth. Submerging the pot under rainwater for a day drowns them without chemicals, which is the only safe option — ordinary insecticide kills carnivorous plants. Isolate any new arrival for a fortnight."
  },
  {
    id: "sarracenia", group: "carnivorous", name: "Trumpet Pitcher",
    latin: "Sarracenia", draw: "sarracenia",
    water: "Check the moss with a finger; if it is still moist, do nothing. Through spring and summer it should stand in a tray with two or three centimetres of rainwater — this is a bog plant and it is very hard to overwater in the growing season. Rainwater or distilled water only. Do not pour water down the pitchers themselves; they fill from rain naturally and tipping water in washes out what they have caught.",
    light: "Full sun, all day, outdoors if you can. This is not a windowsill plant, and in weak light the pitchers come up short, floppy and green instead of tall and veined with red. It must have a proper winter dormancy: leave it outside through the cold, keep the moss damp but drop the water tray, and let it die back. It survives frost easily. Without that cold rest it weakens and dies within a couple of years.",
    grow: "Split the rhizome — the thick horizontal root — in early spring before it wakes up. Cut a piece with at least one growing point and some roots and pot it in moss and sand. It looks like the parent in its first season. Seed works too but is slow: four to five years before it looks anything like the plant it came from.",
    clean: "Rain washes the pitchers, so there is little dusting to do; if it lives indoors, rinse it under rainwater now and then. Cut brown pitchers off near the base once they have fully died, using scissors. Trim in autumn and early spring, and leave the dead pitchers standing over winter, because they shelter the crown from the worst of the cold.",
    pests: "Aphids and, outdoors, slugs chewing holes in new pitchers are the usual trouble; pick slugs off by hand in the evening and drown aphids by submerging the pot. Never use a normal insecticide. Keep new plants apart for a couple of weeks so nothing arrives and spreads through a bog tray, where everything shares the same water."
  },
  {
    id: "nepenthes", group: "carnivorous", name: "Monkey Cups",
    latin: "Nepenthes", draw: "nepenthes",
    water: "Feel the top of the compost: moist means leave it, drying means water it. Unlike a flytrap, a Nepenthes must not stand in a tray of water — its roots need air and they rot if they sit wet. Water it from the top with rainwater and let it drain. It likes humid air, so a bathroom or a regular misting suits it well.",
    light: "Bright light but not harsh direct sun, which scorches the leaves and stops the pitchers forming. A plant in poor light grows leaves and no pitchers at all, which is the usual complaint. There is no winter dormancy — it is a tropical plant and must stay warm, above about 15 degrees, all year round. Cold is what kills most of them.",
    grow: "Take a stem cutting with two or three leaves, cutting just below a node, and trim each leaf in half to cut down water loss. Stand it in damp moss inside a sealed bag somewhere warm and bright. It roots in one to three months and starts making pitchers of its own within a year, though it takes two or three years to look like a full-grown parent plant.",
    clean: "Wipe the broad leaves with a damp cloth, as dust settles on them and blocks the light; be careful of the thin tendril holding each pitcher, because it snaps easily. Cut just above a node if you need to shorten a vine and it will branch from there. Prune in spring or summer while it is in growth, and avoid cutting in the coldest, darkest part of the year.",
    pests: "Mealybugs hide under the leaves and in the joints where the pitchers attach; wipe them off with soapy water on a cotton bud. Because Nepenthes are often grown crowded together in a humid spot, mealybugs spread fast, so check the whole group if you find them on one."
  },
  {
    id: "butterwort", group: "carnivorous", name: "Butterwort",
    latin: "Pinguicula", draw: "butterwort",
    water: "Feel the surface: keep it damp but never standing deep in water. A shallow tray with half a centimetre of rainwater through summer is right. Rainwater or distilled only. The leaves feel greasy rather than sticky-wet, which is where the name comes from, and that greasiness is the trap.",
    light: "Bright light, a little direct sun. Mexican butterworts — the kind usually sold — have an unusual rest: in winter the sticky leaves are replaced by a tight rosette of small non-carnivorous succulent leaves, and the plant wants to be kept nearly dry until it starts growing again in spring. That change is normal and alarms people who think it is dying.",
    grow: "Pull a single succulent leaf off during the winter rosette stage, taking it cleanly from the base, and lay it flat on damp sand and moss. A tiny plant forms at the base of the leaf in about a month. Butterworts also make offsets beside the parent which can simply be separated. Either reaches full size in under a year.",
    clean: "Do not wipe the leaves — the greasy coating is the trap. If the leaves collect dust, a light mist of rainwater is enough. Pull off dead brown leaves at the base so mould does not spread. Tidy in spring and summer, and leave it alone during the winter rosette.",
    pests: "Butterworts are famously good at catching fungus gnats, which is why keen growers stand one next to their other houseplants as living flypaper. They themselves are rarely troubled; aphids occasionally attack new growth and are dealt with by submerging the pot in rainwater."
  },
  {
    id: "bladderwort", group: "carnivorous", name: "Bladderwort",
    latin: "Utricularia", draw: "bladderwort",
    water: "Keep it very wet — wetter than any other plant here. The terrestrial kinds like a tray of rainwater two or three centimetres deep all year, and the aquatic kinds simply float in a jar of rainwater. It must never dry out at any point. Rainwater or distilled only.",
    light: "Bright light, including direct sun, which is what brings the little flowers. It has no real dormancy, though it slows in winter and the tray can be dropped a little. Most people grow it for the flowers and never see the traps at all.",
    grow: "It spreads by itself, sending runners through the wet moss until it fills the pot and creeps into neighbouring ones. To make more, simply scoop out a piece of the mossy mat with runners in it and press it onto damp moss in another pot. It establishes within weeks. There is nothing difficult about it.",

function pot(c, w) {
  c.fillStyle = "#b5653f";
  c.beginPath();
  c.moveTo(-w, 0); c.lineTo(w, 0);
  c.lineTo(w * 0.74, w * 0.95); c.lineTo(-w * 0.74, w * 0.95);
  c.closePath(); c.fill();
  c.fillStyle = "#9c5334";
  c.fillRect(-w * 1.06, -w * 0.16, w * 2.12, w * 0.2);
}

function leafShape(c, len, wide, colour) {
  c.fillStyle = colour;
  c.beginPath();
  c.moveTo(0, 0);
  c.quadraticCurveTo(wide, -len * 0.45, 0, -len);
  c.quadraticCurveTo(-wide, -len * 0.45, 0, 0);
  c.fill();
}

function heart(c, x, y, r, colour) {
  c.fillStyle = colour;
  c.beginPath();
  c.moveTo(x, y + r);
  c.bezierCurveTo(x - r * 1.5, y - r * 0.4, x - r * 0.45, y - r * 1.3, x, y - r * 0.35);
  c.bezierCurveTo(x + r * 0.45, y - r * 1.3, x + r * 1.5, y - r * 0.4, x, y + r);
  c.fill();
}

function dewDrops(c, x1, y1, x2, y2, n, colour) {
  c.fillStyle = colour;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    c.beginPath();
    c.arc(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, 3, 0, Math.PI * 2);
    c.fill();
  }
}

    c.beginPath(); c.arc(0, 0, 5, 0, Math.PI * 2); c.fill();
    c.restore();
  },
  bladderwort(c) {
    // wet moss, because a bladderwort is always grown soaking
    c.fillStyle = "#6f9b55";
    c.beginPath(); c.ellipse(0, 6, 78, 22, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#84b163";
    for (let i = 0; i < 14; i++) {
      const x = -70 + i * 10.5;
      c.beginPath(); c.arc(x, -2 + (i % 3) * 4, 8, 0, Math.PI * 2); c.fill();
    }
    c.strokeStyle = "#5f9142"; c.lineWidth = 2.4; c.lineCap = "round";
    for (let i = 0; i < 16; i++) {
      const x = -62 + i * 8;
      c.beginPath();
      c.moveTo(x, 0);
      c.quadraticCurveTo(x + (i % 2 ? 5 : -5), -16, x + (i % 2 ? 9 : -9), -32);
      c.stroke();
    }
    // the traps are underground, so what you actually see are the flowers
    for (const [x, h] of [[-34, -78], [4, -96], [38, -70]]) {
      c.strokeStyle = "#6fa04c"; c.lineWidth = 3;
      c.beginPath(); c.moveTo(x, -4); c.lineTo(x, h); c.stroke();
      c.fillStyle = "#f2c53d";
      c.beginPath(); c.ellipse(x, h - 6, 13, 10, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#e0a81f";
      c.beginPath(); c.ellipse(x, h + 2, 9, 7, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#8a5a12";
      c.beginPath(); c.arc(x, h - 4, 3, 0, Math.PI * 2); c.fill();
    }
  },
  darlingtonia(c) {
    pot(c, 32);
    // hooded tubes that twist round like a snake about to strike
    for (const [x, h, s] of [[-34, 78, -1], [0, 108, 1], [34, 86, -1]]) {
      c.save(); c.translate(x, -6);
      const g = c.createLinearGradient(-12, 0, 12, 0);
      g.addColorStop(0, "#4f7f3d"); g.addColorStop(0.5, "#93c06d"); g.addColorStop(1, "#4a7538");
      c.fillStyle = g;
      c.beginPath();
      c.moveTo(-10, 0);
      c.quadraticCurveTo(-16, -h * 0.6, -9, -h);
      c.lineTo(9, -h);
      c.quadraticCurveTo(16, -h * 0.6, 10, 0);
      c.closePath(); c.fill();
      c.save(); c.translate(0, -h);
      // the balloon of a hood, leaning over to one side
      c.fillStyle = "#7fae5e";
      c.beginPath(); c.ellipse(s * 5, -11, 20, 17, s * 0.3, 0, Math.PI * 2); c.fill();
      c.fillStyle = "rgba(246,250,236,.72)";
      for (const [wx, wy] of [[-6, -18], [6, -14], [0, -8], [-12, -10], [12, -21]]) {
        c.beginPath(); c.ellipse(s * 4 + wx, wy, 4, 3, 0, 0, Math.PI * 2); c.fill();
      }
      // the mouth is underneath, facing forward, not on top
      c.fillStyle = "#395a2b";
      c.beginPath(); c.ellipse(-s * 7, -1, 9, 5.5, -s * 0.2, 0, Math.PI * 2); c.fill();
      // and the forked tongue hangs down out of it
      c.fillStyle = "#b0432f";
      c.save(); c.translate(-s * 7, 1);
      c.beginPath();
      c.moveTo(-3, 0);
      c.lineTo(-13, 20); c.lineTo(-4, 15);
      c.lineTo(0, 25); c.lineTo(4, 15);
      c.lineTo(13, 20); c.lineTo(3, 0);
      c.closePath(); c.fill();
      c.restore();
      c.restore();
      c.restore();
    }
  },
  cephalotus(c) {
    pot(c, 32);
    // flat ordinary leaves first, then the little jugs in front
    for (let i = 0; i < 6; i++) {
      const a = -1.4 + (i / 5) * 2.8;
      c.save(); c.translate(0, -10); c.rotate(a);
      leafShape(c, 44, 16, "#5d9c47");
      c.restore();
    }
    for (const [x, y, s] of [[-38, -6, 1], [-12, -14, 1.15], [16, -10, 1.05], [40, -2, 0.9]]) {
      c.save(); c.translate(x, y); c.scale(s, s); c.rotate((x / 90) * 0.5);
      const g = c.createLinearGradient(-14, 0, 14, 0);
      g.addColorStop(0, "#6b2f27"); g.addColorStop(0.5, "#b4523c"); g.addColorStop(1, "#652c25");
      c.fillStyle = g;
      c.beginPath();
      c.moveTo(-13, 0);
      c.quadraticCurveTo(-17, -18, -9, -28);
      c.quadraticCurveTo(0, -33, 9, -28);
      c.quadraticCurveTo(17, -18, 13, 0);
      c.closePath(); c.fill();
      // the ribs down the front, which a Cephalotus really has
      c.strokeStyle = "rgba(60,25,20,.5)"; c.lineWidth = 2;
      for (const rx of [-8, 0, 8]) {
        c.beginPath(); c.moveTo(rx, -2); c.lineTo(rx * 1.1, -24); c.stroke();
      }
      c.fillStyle = "#8f3a2c";
      c.beginPath(); c.ellipse(0, -28, 11, 4, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#c86a4a";
      c.save(); c.translate(0, -30); c.rotate(-0.4);
      c.beginPath(); c.ellipse(0, -6, 11, 6, 0, 0, Math.PI * 2); c.fill();
      c.restore();
      c.restore();
    }
  },
  heliamphora(c) {
    pot(c, 32);
    // narrow tubes that flare open at the top, from the cloud mountains
    for (const [x, h] of [[-36, 74], [-12, 100], [14, 94], [38, 70]]) {
      c.save(); c.translate(x, -6); c.rotate((x / 120) * 0.5);
      const g = c.createLinearGradient(-14, 0, 14, 0);
      g.addColorStop(0, "#5e8a45"); g.addColorStop(0.45, "#a8c67c"); g.addColorStop(1, "#7a5340");
      c.fillStyle = g;
      c.beginPath();
      c.moveTo(-7, 0);
      c.quadraticCurveTo(-12, -h * 0.5, -15, -h);
      c.lineTo(15, -h);
      c.quadraticCurveTo(12, -h * 0.5, 7, 0);
      c.closePath(); c.fill();
      c.fillStyle = "#9c4a38";
      c.beginPath(); c.ellipse(0, -h, 15, 5, 0, 0, Math.PI * 2); c.fill();
      // the little nectar spoon on the back of the mouth
      c.fillStyle = "#c85f45";
      c.beginPath(); c.ellipse(4, -h - 8, 6, 5, 0.3, 0, Math.PI * 2); c.fill();
      // a slit near the top, where rainwater drains out
      c.strokeStyle = "rgba(70,40,30,.45)"; c.lineWidth = 2;
      c.beginPath(); c.moveTo(-3, -h * 0.72); c.lineTo(3, -h * 0.72); c.stroke();
      c.restore();
    }
  },
  byblis(c) {
    pot(c, 30);
    c.strokeStyle = "#6fa348"; c.lineWidth = 5; c.lineCap = "round";
    c.beginPath(); c.moveTo(0, -6); c.lineTo(0, -70); c.stroke();
    // thread-thin leaves sticking out everywhere, each one beaded with dew
    const cols = ["#e8536f", "#f2a03d", "#f2e05a", "#7fd4e8", "#b98fd8"];
    for (let i = 0; i < 14; i++) {
      const a = -1.35 + (i / 13) * 2.7;
      const len = 64 + (i % 3) * 12;
      c.save(); c.translate(0, -18 - (i % 4) * 12); c.rotate(a);
      c.strokeStyle = "#8cc456"; c.lineWidth = 2.4;
      c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(4, -len * 0.6, 0, -len); c.stroke();
      for (let d = 1; d <= 5; d++) {
        c.fillStyle = cols[(i + d) % cols.length];
        c.beginPath(); c.arc(2, -d * (len / 5.4), 2.8, 0, Math.PI * 2); c.fill();
      }
      c.restore();
    }
    for (const [x, y] of [[-26, -74], [22, -84]]) {
      c.save(); c.translate(x, y);
      for (let p = 0; p < 5; p++) {
        c.save(); c.rotate((p / 5) * Math.PI * 2);
        c.fillStyle = "#a58fd8";
        c.beginPath(); c.ellipse(0, -10, 7, 10, 0, 0, Math.PI * 2); c.fill();
        c.restore();
      }
      c.fillStyle = "#f5e06a";
      c.beginPath(); c.arc(0, 0, 4, 0, Math.PI * 2); c.fill();
      c.restore();
    }
  },
  drosophyllum(c) {
    pot(c, 32);
    // dry sandy soil on top, because this one hates a wet tray
    c.fillStyle = "#d8c9a3";
    c.beginPath(); c.ellipse(0, -4, 33, 7, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "#6f9b4a"; c.lineWidth = 6; c.lineCap = "round";
    c.beginPath(); c.moveTo(0, -8); c.lineTo(-2, -52); c.stroke();
    // leaves that curl outwards and back on themselves
    for (let i = 0; i < 11; i++) {
      const a = -1.4 + (i / 10) * 2.8;
      c.save(); c.translate(-2, -46); c.rotate(a);
      c.strokeStyle = "#79ab4f"; c.lineWidth = 4; c.lineCap = "round";
      c.beginPath();
      c.moveTo(0, 0);
      c.quadraticCurveTo(14, -34, 4, -62);
      c.stroke();
      dewDrops(c, 8, -12, 8, -56, 5, "#f0f5d8");
      c.restore();
    }
    for (const [x, y] of [[-30, -78], [26, -88], [0, -100]]) {
      c.save(); c.translate(x, y);
      for (let p = 0; p < 5; p++) {
        c.save(); c.rotate((p / 5) * Math.PI * 2);
        c.fillStyle = "#f2d14b";
        c.beginPath(); c.ellipse(0, -11, 8, 11, 0, 0, Math.PI * 2); c.fill();
        c.restore();
      }
      c.fillStyle = "#d8a51f";
      c.beginPath(); c.arc(0, 0, 4.5, 0, Math.PI * 2); c.fill();
      c.restore();
    }
  }
};

function paintPlant(canvas, id) {
  const p = PLANTS.find(x => x.id === id);
  const c = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const box = canvas.clientWidth || 160;
  canvas.width = box * dpr;
  canvas.height = box * dpr;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, box, box);
  c.save();
  c.translate(box / 2, box * 0.62);
  const s = box / 260;
  c.scale(s, s);
  ART[p.draw](c);
  c.restore();
}

// ---------------------------------------------------------------------------
// Tabs
// ---------------------------------------------------------------------------
let tabMode = "main";        // "main" = two tabs, "browse" = four tabs
let openGroup = null;

const tabsEl = document.getElementById("tabs");
const viewHome = document.getElementById("viewHome");
const viewGrid = document.getElementById("viewGrid");
const viewPage = document.getElementById("viewPage");

function show(which) {
  viewHome.hidden = which !== "home";
  viewGrid.hidden = which !== "grid";
  viewPage.hidden = which !== "page";
  window.scrollTo(0, 0);
}

function drawTabs(active) {
  tabsEl.innerHTML = "";
  const add = (label, on, cls, fn) => {
    const b = document.createElement("button");
    b.className = "tab" + (on ? " on" : "") + (cls ? " " + cls : "");
    b.textContent = label;
    b.addEventListener("click", fn);
    tabsEl.appendChild(b);
  };

  if (tabMode === "main") {
    add("Identify a plant", active === "home", "", () => { show("home"); drawTabs("home"); });
    add("Look through the plants", active === "browse", "", () => {
      tabMode = "browse";
      openGroup = null;
      drawTabs("browse");
      showAllPlants();
    });
  } else {
    // the two tabs are replaced by four
    add("Back", false, "back", () => {
      tabMode = "main";
      drawTabs("home");
      show("home");
    });
    for (const key of ["outside", "house", "carnivorous"]) {
      add(GROUPS[key].name, openGroup === key, "", () => {
        openGroup = key;
        drawTabs("browse");
        showGroup(key);
      });
    }
  }
}

// The identify page
// ---------------------------------------------------------------------------
let picked = null;           // the image the user put in

viewHome.innerHTML =
  '<p class="note" id="homeNote"></p>' +
  '<div class="identify" id="idRow">' +
    '<div id="idResult" style="flex:1 1 440px; min-width:280px"></div>' +
    '<div class="dropCol" id="dropCol">' +
      '<div class="dropBox" id="dropBox">' +
        '<p><b>Put a picture here</b><br>Paste it with Ctrl+V, drag one in, or click to choose a photo.</p>' +
      '</div>' +

      '<div class="shotCap">Your picture</div>' +
    '</div>' +
  '</div>' +
  '<input type="file" id="filePick" accept="image/*" hidden>';

document.getElementById("homeNote").innerHTML =
  "<b>What this can and cannot do.</b> There are thirty-six plants in here — twelve that live " +
  "outdoors, twelve that live in the house and twelve that eat insects. The pictures and all " +

  "The identifying is not a trained model yet — it compares the colours in your photo " +

const dropBox = document.getElementById("dropBox");
const goBtn = document.getElementById("goBtn");
const idResult = document.getElementById("idResult");
